<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>H2 · Agent Team</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--panel:#242424;--line:#454545;--text:#f2f2f2;--muted:#9b9b9b;--green:#19c37d;--amber:#ff9d3d;--red:#ee6a6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{margin:22px auto;max-width:1180px;padding:0 18px}.panel{border:1px solid #3f3f3f;background:var(--panel);border-radius:18px;box-shadow:0 16px 40px #0005}.head{padding:22px 26px}.headrow{display:flex;align-items:center;gap:12px}.mark{width:26px;height:26px;border:2px solid #aaa;border-radius:7px;position:relative}.mark:before,.mark:after{content:"";position:absolute;background:#aaa}.mark:before{width:11px;height:2px;left:6px;top:10px}.mark:after{width:2px;height:11px;left:11px;top:5px}.title{font-size:20px;font-weight:700}.sub{color:var(--muted);font-size:15px}.stats{margin-left:auto;color:var(--muted)}button{border:1px solid #555;background:#363636;color:var(--text);border-radius:9px;padding:8px 13px;cursor:pointer}button:hover{background:#444}.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.phase{min-height:100px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#2c2c2c;position:relative}.phase:after{content:"";position:absolute;top:26px;right:-11px;width:12px;border-top:1px solid #666}.phase:last-child:after{display:none}.phase[data-state=running]{border-color:var(--amber);box-shadow:0 0 0 1px #ff9d3d44}.phase[data-state=done]{border-color:var(--green)}.phase[data-state=failed]{border-color:var(--red)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:7px}.phase[data-state=running] .dot{background:var(--amber);animation:pulse 1s infinite}.phase[data-state=done] .dot{background:var(--green)}.phase[data-state=failed] .dot{background:var(--red)}.phase-name{font-weight:650}.state{float:right;color:var(--muted);font-size:12px}.actors{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.actor{padding:6px 9px;border-radius:9px;background:#363636;color:#ddd;font-size:12px}.actor.running{outline:1px solid var(--amber);color:#ffd0a1}.actor.done{outline:1px solid #268f68;color:#a8f0cf}.workspace{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.body{padding:20px}.body h2{font-size:15px;margin:0 0 12px}.log{height:270px;overflow:auto;border-top:1px solid var(--line)}.event{display:grid;grid-template-columns:90px 150px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #333;color:#d8d8d8}.event small{color:var(--muted)}.event b{font-weight:600}.event[data-state=done] b{color:#8ce7bd}.event[data-state=running] b{color:#ffc082}.event[data-state=failed] b{color:#ff9898}.result{white-space:pre-wrap;color:#d4d4d4;min-height:120px}.hint{color:var(--muted);font-size:12px;margin-top:10px}@keyframes pulse{50%{opacity:.3}}@media(max-width:800px){.rail,.workspace{grid-template-columns:1fr}.phase:after{display:none}.stats{margin-left:0}.headrow{flex-wrap:wrap}.event{grid-template-columns:70px 1fr}}
</style>
<body><main class="shell"><section class="panel head"><div class="headrow"><span class="mark"></span><span class="title">工作流运行中</span><span class="sub" id="run-title">阶段 0 · 控制面资格化</span><span class="stats">4 个阶段 · 3 个 worker</span><button id="run">Run demo</button></div><div class="rail" id="rail"></div></section><section class="workspace"><section class="panel body"><h2>运行日志</h2><div class="log" id="log"></div></section><section class="panel body"><h2>协调结果</h2><div class="result" id="result">等待运行。</div><div class="hint">H2 的核心是阶段边界、并行 worker、汇总和可复盘事件。</div></section></section></main>
<script>
const phases=[{name:"控制面资格化",actors:["脚本"]},{name:"三个 worker 并行检查",actors:["读图检验员","编辑提交员","规范朗读员"]},{name:"协调者收集验收",actors:["收集协调者"]},{name:"哨兵巡查日志",actors:["哨兵·日志巡查员"]}];
const rail=document.querySelector('#rail'),log=document.querySelector('#log'),result=document.querySelector('#result'),title=document.querySelector('#run-title');
function draw(states){rail.innerHTML=phases.map((p,i)=>`<article class="phase" data-state="${states[i]||'pending'}"><span class="dot"></span><span class="phase-name">${p.name}</span><span class="state">${states[i]||'pending'}</span><div class="actors">${p.actors.map(a=>`<span class="actor ${states[i]||''}">${a}</span>`).join('')}</div></article>`).join('')}
function add(phase,actor,state,text){const row=document.createElement('div');row.className='event';row.dataset.state=state;row.innerHTML=`<small>${phase}</small><b>${actor}</b><span>${text}</span>`;log.append(row);log.scrollTop=log.scrollHeight}
async function run(){log.innerHTML='';result.textContent='';const states=['pending','pending','pending','pending'];draw(states);const wait=ms=>new Promise(r=>setTimeout(r,ms));states[0]='running';title.textContent='阶段 0 · 控制面资格化';draw(states);add(phases[0].name,'脚本','running','检查输入和运行权限');await wait(450);add(phases[0].name,'脚本','done','控制面可运行');states[0]='done';states[1]='running';title.textContent='阶段 1 · 三个 worker 并行检查';draw(states);await Promise.all(phases[1].actors.map(async(a,i)=>{await wait(180+i*120);add(phases[1].name,a,'running',['读取项目结构','检查可交付修改','检查命名和文档'][i]);await wait(320);add(phases[1].name,a,'done','完成')}));states[1]='done';states[2]='running';title.textContent='阶段 2 · 协调者收集验收';draw(states);add(phases[2].name,'收集协调者','running','收齐三个 worker 的结果');await wait(500);add(phases[2].name,'收集协调者','done','验收通过');states[2]='done';states[3]='running';title.textContent='阶段 3 · 哨兵巡查日志';draw(states);add(phases[3].name,'哨兵·日志巡查员','running','检查事件顺序和遗漏');await wait(400);add(phases[3].name,'哨兵·日志巡查员','done','检查完成');states[3]='done';draw(states);title.textContent='运行完成';result.textContent='所有阶段完成。\n\n协调者确认：3 个 worker 均返回结果。\n哨兵确认：事件顺序完整，可继续接入真实 Agent。'}
draw(['pending','pending','pending','pending']);document.querySelector('#run').onclick=run;
</script></body></html>
